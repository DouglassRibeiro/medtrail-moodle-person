{% extends 'base.html' %}
{% load static %}

{% block content %}
<div id="modal-overlay"
    class="animate-modal-in fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300">

    <!-- Card do Pop-up -->
    <div class="relative w-full max-w-md p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">

        <!-- Botão de Fechar -->
        <button
            onclick="const m = document.getElementById('modal-overlay'); m.classList.remove('animate-modal-in'); m.classList.add('animate-modal-out'); setTimeout(() => document.getElementById('modal-container').innerHTML='', 300);"
            class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold cursor-pointer">
            ✕
        </button>

        <h2 class="text-2xl font-bold text-white mb-6 text-center">Entrar</h2>

        <!-- Formulário de Login -->
        <form hx-post="{% url 'accounts:login' %}" hx-target="#modal-container" hx-select="#modal-overlay"
            hx-swap="innerHTML">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm text-gray-300 mb-1">E-mail</label>
                <input type="email" name="email"
                    class="w-full p-3 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500"
                    required>
            </div>

            <div class="mb-6">
                <label class="block text-sm text-gray-300 mb-1">Senha</label>
                <input type="password" name="password"
                    class="w-full p-3 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500"
                    required>
            </div>

            <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-colors cursor-pointer">
                Acessar
            </button>
        </form>

    </div>
</div>
{% endblock %}
