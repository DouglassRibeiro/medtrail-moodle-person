{% extends 'base.html' %}
{% block content %}
<div id="modal-overlay"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 [&.htmx-settling]:opacity-0 [&.htmx-swapping]:opacity-0">

    <!-- Card do Pop-up -->
    <div
        class="relative w-full max-w-md p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl transition-all duration-300 [&.htmx-settling]:scale-95 [&.htmx-swapping]:scale-95">

        <!-- Botão de Fechar (Esvazia o #modal-container) -->
        <button onclick="document.getElementById('modal-container').innerHTML=''"
            class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold">
            ✕
        </button>

        <h2 class="text-2xl font-bold text-white mb-6 text-center">Entrar</h2>

        <!-- Formulário de Login -->
        <form hx-post="{% url 'accounts:login' %}" hx-target="#modal-container">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm text-gray-300 mb-1">E-mail</label>
                <input type="email" name="email"
                    class="w-full p-3 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500"
                    required>
            </div>

            <div class="mb-6">
                <label class="block text-sm text-gray-300 mb-1">Senha</label>
                <input type="password" name="password"
                    class="w-full p-3 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500"
                    required>
            </div>

            <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-colors">
                Acessar
            </button>
        </form>

    </div>
</div>
{% endblock %}
